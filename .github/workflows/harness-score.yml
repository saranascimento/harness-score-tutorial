name: Harness Score

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  harness-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: paladini/harness-score@v1
        with:
          min-level: "4"
          badge: ""
